<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TransitTicker Simulator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1220;
    color: #e6edf3;
    padding: 24px 16px;
  }
  .card {
    background: #131b2b;
    border: 1px solid #223049;
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 2px; }
  p.sub { color: #8b96a8; margin: 0 0 22px; font-size: 0.85rem; }
  label { display: block; font-size: 0.8rem; color: #a7b2c4; margin: 16px 0 6px; }
  select, button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2a3852;
    background: #0e1626;
    color: #e6edf3;
    font-size: 0.95rem;
  }
  select:disabled { opacity: 0.5; }
  button {
    margin-top: 22px;
    background: #3b82f6;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #2a3852; cursor: not-allowed; }
  .departures {
    margin-top: 12px;
    border-radius: 8px;
    background: #0e1626;
    border: 1px solid #223049;
    overflow: hidden;
  }
  .departures .empty {
    padding: 18px;
    text-align: center;
    color: #8b96a8;
    font-size: 0.85rem;
  }
  .departure-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 18px;
  }
  .departure-row + .departure-row {
    border-top: 1px solid #223049;
  }
  .departure-row .minutes {
    font-weight: 700;
    font-size: 1.1rem;
  }
  .departure-row .left {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #34d399;
    text-transform: uppercase;
  }
  .live-badge::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #34d399;
  }
  .scheduled-badge {
    font-size: 0.65rem;
    color: #5b6577;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  /* Soonest departure (first row) reads like the headline number on a real
     platform countdown clock; the rest are supporting detail below it. */
  .departure-row:first-child {
    padding: 16px 18px;
  }
  .departure-row:first-child .minutes {
    font-size: 1.9rem;
    color: #3b82f6;
  }
  .departure-row .time {
    color: #8b96a8;
    font-size: 0.8rem;
  }
  .error {
    color: #f87171;
    font-size: 0.82rem;
    margin-top: 14px;
    line-height: 1.4;
  }
  .auth-bar {
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid #223049;
  }
  .auth-bar .signed-in {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .auth-bar .who {
    font-size: 0.85rem;
    color: #a7b2c4;
  }
  .auth-bar .sign-out {
    width: auto;
    margin-top: 0;
    padding: 6px 12px;
    font-size: 0.8rem;
    background: #1c2740;
  }
  .device-status {
    margin-top: 12px;
  }
  .device-status .paired {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.8rem;
    color: #34d399;
  }
  .device-status .unlink-device {
    width: auto;
    margin-top: 0;
    padding: 6px 12px;
    font-size: 0.8rem;
    background: #1c2740;
  }
  .device-status .pair-form label {
    margin: 0 0 6px;
  }
  .device-status .pair-row {
    display: flex;
    gap: 8px;
  }
  .device-status .pair-row input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2a3852;
    background: #0e1626;
    color: #e6edf3;
    font-size: 0.95rem;
    font-family: ui-monospace, monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .device-status .pair-row button {
    width: auto;
    margin-top: 0;
    padding: 10px 14px;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  .my-stations h2 {
    font-size: 0.95rem;
    margin: 0 0 2px;
  }
  .my-stations .sub {
    margin: 0 0 16px;
  }
  .station-slot {
    margin-bottom: 16px;
  }
  .slot {
    padding: 12px;
    border: 1px solid #223049;
    border-radius: 8px;
    background: #0e1626;
  }
  .slot-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: #a7b2c4;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .slot select {
    margin-bottom: 8px;
  }
  .slot select:last-of-type {
    margin-bottom: 0;
  }
  .clear-slot {
    width: auto;
    margin-top: 8px;
    padding: 5px 10px;
    font-size: 0.75rem;
    background: #1c2740;
  }
  .boot-status {
    color: #8b96a8;
    font-size: 0.85rem;
    text-align: center;
  }
  .boot-status.boot-error {
    color: #f87171;
    text-align: left;
    white-space: pre-wrap;
    font-family: ui-monospace, monospace;
    font-size: 0.75rem;
  }
</style>
</head>
<body>
<!-- Placeholder content, replaced once React actually mounts. If this is
     still on screen - not the real UI, not an error box - with no red text
     below, React never took over at all: check the browser console (F12)
     for a CDN/network error the boot script below wasn't able to catch. -->
<div id="root"><div class="boot-status">Loading TransitTicker...</div></div>

<!-- Runs before anything else, and is plain JS (not type="text/babel") on
     purpose: if Babel itself fails to load below, no text/babel script ever
     runs - including any error handling written inside one. This is what
     turns a silent blank page into a visible, specific error message when a
     CDN script fails, and a generic "still not loaded" message after a
     timeout for failure modes this doesn't catch directly. -->
<script>
(function () {
  function showBootError(message) {
    var root = document.getElementById('root');
    if (!root) return;
    root.innerHTML = '<div class="card"><h1>TransitTicker</h1>' +
      '<div class="boot-status boot-error">Failed to start the page.\n\n' +
      message +
      '\n\nCheck the browser console (F12) for more detail.</div></div>';
  }

  window.addEventListener('error', function (e) {
    // Capture-phase listener so this also catches <script src> load
    // failures (bad CDN URL, network block, ad blocker), not just runtime
    // exceptions - those don't bubble, but they are visible in the capture
    // phase on window/document.
    var target = e.target;
    if (target && target.tagName === 'SCRIPT') {
      showBootError('Failed to load a required script: ' + (target.src || '(inline script)'));
    } else if (e.message) {
      showBootError(e.message);
    }
  }, true);

  // Backstop for anything the listener above doesn't catch (e.g. Babel
  // loads fine but never finds/transforms the app script for some reason).
  window.setTimeout(function () {
    if (!window.__transitTickerMounted) {
      showBootError('The page did not finish loading within 8 seconds.');
    }
  }, 8000);
})();
</script>

<!-- Simple, no-build-step React setup: UMD builds + in-browser JSX transform.
     Fine for a small internal simulator UI; a real app would use a proper
     bundler, but that's unnecessary complexity here.

     @babel/standalone is pinned to an exact version (7.29.0, the last Babel 7
     release - https://babeljs.io/blog/2026/01/31/7.29.0). An unversioned
     unpkg URL for this package resolves to whichever release is currently
     newest, and Babel 8's standalone build uses `import` syntax that is
     incompatible with loading it as a plain, non-module <script> tag the way
     this page does - see https://github.com/babel/babel/issues/18073.
     Pinning keeps this page's behavior independent of Babel's release
     schedule. -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<!-- Google Identity Services: renders the "Sign in with Google" button and
     hands back a signed ID token directly in the browser - no OAuth
     redirect/callback dance needed, since this app only needs to know who
     signed in, not to call a Google API on their behalf. Loads async, so
     the React code below polls briefly for window.google rather than
     assuming it's ready by the time it runs. -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Injected by the Flask server at runtime from the BACKEND_API_URL env var,
     so this image doesn't need to be rebuilt to point at a different backend. -->
<script src="/config.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

const BACKEND_URL = window.BACKEND_API_URL || "http://localhost:5000";

const DIRECTIONS = [
  { value: 0, label: "Uptown (0)" },
  { value: 1, label: "Downtown (1)" },
];

// One saved-station slot: its own route/stop/direction pickers, reusing
// the same /routes/<id>/stops lookup. Kept as a separate component (rather
// than inlined 3 times in App) so each slot's own "stops for this route"
// fetch and loading state stay isolated from the other two slots.
function StationPicker({ label, routes, value, onChange }) {
  const [stops, setStops] = useState([]);
  const [loadingStops, setLoadingStops] = useState(false);

  const route = value ? value.route : "";
  const stop = value ? value.stop : "";
  const direction = value ? value.direction : 1;

  useEffect(() => {
    if (!route) {
      setStops([]);
      return;
    }
    setLoadingStops(true);
    fetch(`${BACKEND_URL}/routes/${encodeURIComponent(route)}/stops`)
      .then((res) => {
        if (!res.ok) throw new Error(`backend returned ${res.status}`);
        return res.json();
      })
      .then(setStops)
      .catch(() => setStops([]))
      .finally(() => setLoadingStops(false));
  }, [route]);

  return (
    <div className="slot">
      <div className="slot-label">{label}</div>
      <select
        value={route}
        onChange={(e) => {
          const newRoute = e.target.value;
          if (!newRoute) {
            onChange(null);
          } else {
            onChange({ route: newRoute, stop: "", direction: 1 });
          }
        }}
      >
        <option value="">Select a route</option>
        {routes.map((r) => (
          <option key={r} value={r}>{r}</option>
        ))}
      </select>
      <select
        value={stop}
        onChange={(e) => onChange({ route, stop: e.target.value, direction })}
        disabled={!route || loadingStops}
      >
        <option value="">{loadingStops ? "Loading stops..." : "Select a stop"}</option>
        {stops.map((s) => (
          <option key={s.stop_id} value={s.stop_id}>{s.stop_name}</option>
        ))}
      </select>
      <select
        value={direction}
        onChange={(e) => onChange({ route, stop, direction: Number(e.target.value) })}
      >
        {DIRECTIONS.map((d) => (
          <option key={d.value} value={d.value}>{d.label}</option>
        ))}
      </select>
      {value && (
        <button className="clear-slot" onClick={() => onChange(null)}>Clear</button>
      )}
    </div>
  );
}

// Renders a list of departures exactly like a small platform countdown
// clock would - reused for every saved station's live preview.
function DeparturesBoard({ departures }) {
  return (
    <div className="departures">
      {departures && departures.length > 0 ? (
        departures.map((d, i) => (
          <div className="departure-row" key={i}>
            <span className="left">
              <span className="minutes">{d.minutes_away} min</span>
              {d.is_realtime ? (
                <span className="live-badge">Live</span>
              ) : (
                <span className="scheduled-badge">Scheduled</span>
              )}
            </span>
            <span className="time">{d.departure_time}</span>
          </div>
        ))
      ) : (
        <div className="empty">No upcoming departures found for this station.</div>
      )}
    </div>
  );
}

function App() {
  const [error, setError] = useState(null);

  const [user, setUser] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const googleButtonRef = useRef(null);

  // On mount, see if a session cookie from a previous visit is still valid
  // (credentials: "include" is required for the browser to send it at all
  // on a cross-origin request). Nothing else in the app - the route list,
  // saved stations, anything - loads before this resolves: signing in is a
  // hard prerequisite for the rest of the page, not an optional step.
  useEffect(() => {
    fetch(`${BACKEND_URL}/auth/me`, { credentials: "include" })
      .then((res) => (res.ok ? res.json() : null))
      .then(setUser)
      .catch(() => setUser(null))
      .finally(() => setAuthChecked(true));
  }, []);

  const handleGoogleCredential = useCallback((response) => {
    fetch(`${BACKEND_URL}/auth/google`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id_token: response.credential }),
    })
      .then((res) => {
        if (!res.ok) throw new Error(`backend returned ${res.status}`);
        return res.json();
      })
      .then((data) => {
        setUser(data);
        setError(null);
      })
      .catch((err) => setError(`Sign-in failed: ${err.message}`));
  }, []);

  // Renders Google's own Sign In button once its script has finished
  // loading (it's marked async, so window.google may not exist yet the
  // first time this runs - this polls briefly rather than assuming it is)
  // and only while there's no active session to show it for.
  useEffect(() => {
    if (!authChecked || user || !googleButtonRef.current) return;
    if (!window.GOOGLE_CLIENT_ID) {
      setError("Sign-in is not configured (missing GOOGLE_CLIENT_ID).");
      return;
    }

    let cancelled = false;
    const tryInit = () => {
      if (cancelled) return;
      if (window.google && window.google.accounts && window.google.accounts.id) {
        window.google.accounts.id.initialize({
          client_id: window.GOOGLE_CLIENT_ID,
          callback: handleGoogleCredential,
        });
        window.google.accounts.id.renderButton(googleButtonRef.current, {
          theme: "filled_blue",
          size: "large",
          width: 320,
        });
      } else {
        setTimeout(tryInit, 100);
      }
    };
    tryInit();

    return () => { cancelled = true; };
  }, [authChecked, user, handleGoogleCredential]);

  const signOut = useCallback(() => {
    fetch(`${BACKEND_URL}/auth/logout`, { method: "POST", credentials: "include" })
      .finally(() => setUser(null));
  }, []);

  const [pairingCodeInput, setPairingCodeInput] = useState("");
  const [pairingDevice, setPairingDevice] = useState(false);
  const [unlinkingDevice, setUnlinkingDevice] = useState(false);

  // Claims a pairing code read off a device's own screen - see
  // Backend/src/pairing.py. The raw device token itself never appears
  // here; the response only says whether pairing succeeded.
  const claimPairingCode = useCallback(() => {
    if (!pairingCodeInput) return;
    setPairingDevice(true);
    fetch(`${BACKEND_URL}/device/pair/claim`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pairing_code: pairingCodeInput }),
    })
      .then((res) => {
        if (!res.ok) return res.json().then((body) => Promise.reject(new Error(body.error || `backend returned ${res.status}`)));
        return res.json();
      })
      .then(() => {
        setUser((prev) => (prev ? { ...prev, device_paired: true } : prev));
        setPairingCodeInput("");
        setError(null);
      })
      .catch((err) => setError(`Could not pair device: ${err.message}`))
      .finally(() => setPairingDevice(false));
  }, [pairingCodeInput]);

  const unlinkDevice = useCallback(() => {
    setUnlinkingDevice(true);
    fetch(`${BACKEND_URL}/device/unlink`, { method: "POST", credentials: "include" })
      .then((res) => {
        if (!res.ok) throw new Error(`backend returned ${res.status}`);
        setUser((prev) => (prev ? { ...prev, device_paired: false } : prev));
        setError(null);
      })
      .catch((err) => setError(`Could not unlink device: ${err.message}`))
      .finally(() => setUnlinkingDevice(false));
  }, []);

  // Route list for the station pickers - only fetched once signed in,
  // never before. This is what used to fire unconditionally on page load;
  // gating it on `user` is what actually enforces "sign in is step one"
  // for the whole page, not just for saving.
  const [routes, setRoutes] = useState([]);

  useEffect(() => {
    if (!user) return;
    fetch(`${BACKEND_URL}/routes`)
      .then((res) => {
        if (!res.ok) throw new Error(`backend returned ${res.status}`);
        return res.json();
      })
      .then((data) => {
        setRoutes(data);
        setError(null);
      })
      .catch((err) => setError(`Could not load routes from ${BACKEND_URL}: ${err.message}`));
  }, [user]);

  // Always exactly 3 UI slots, some possibly empty (null) - the backend
  // only ever stores the compact list of filled ones (see savePreferences
  // below), so this pads/truncates whatever comes back from login or
  // /auth/me into fixed slot positions for the 3 pickers to bind to.
  const [preferences, setPreferences] = useState([null, null, null]);
  const [savingPreferences, setSavingPreferences] = useState(false);
  const [preferencesSaved, setPreferencesSaved] = useState(false);
  // One departures preview per slot, populated only after that slot has
  // actually been saved - see savePreferences. Stays null for an edited-
  // but-not-yet-saved slot, so a preview never shows stale data standing
  // in for a change that hasn't been persisted yet.
  const [previews, setPreviews] = useState([null, null, null]);

  useEffect(() => {
    const saved = (user && user.preferences) || [];
    setPreferences([saved[0] || null, saved[1] || null, saved[2] || null]);
    setPreferencesSaved(false);
    setPreviews([null, null, null]);
  }, [user]);

  const updateSlot = useCallback((index, value) => {
    setPreferences((prev) => {
      const next = prev.slice();
      next[index] = value;
      return next;
    });
    setPreferencesSaved(false);
    setPreviews((prev) => {
      const next = prev.slice();
      next[index] = null;
      return next;
    });
  }, []);

  const DEPARTURE_COUNT = 3; // matches a small embedded display's line count

  // Fetches a live preview for one saved slot, via the same public /
  // endpoint the backend (and eventually a paired device) itself reads
  // from - this is the "simulate the backend behavior" step, and
  // deliberately doesn't require a device to be paired to see it.
  const fetchPreview = useCallback((index, pref) => {
    const params = new URLSearchParams({
      route: pref.route,
      stop: pref.stop,
      direction: String(pref.direction),
      count: String(DEPARTURE_COUNT),
    });
    fetch(`${BACKEND_URL}/?${params.toString()}`)
      .then((res) => {
        if (!res.ok) throw new Error(`backend returned ${res.status}`);
        return res.json();
      })
      .then((data) => {
        setPreviews((prev) => {
          const next = prev.slice();
          next[index] = data.departures || [];
          return next;
        });
      })
      .catch((err) => setError(`Could not preview station ${index + 1}: ${err.message}`));
  }, []);

  const savePreferences = useCallback(() => {
    setSavingPreferences(true);
    fetch(`${BACKEND_URL}/preferences`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      // Nulls (empty slots) are dropped rather than sent - the backend's
      // stored list is just "the stations you've set", not 3 fixed
      // positions with gaps.
      body: JSON.stringify({ preferences: preferences.filter(Boolean) }),
    })
      .then((res) => {
        if (!res.ok) throw new Error(`backend returned ${res.status}`);
        return res.json();
      })
      .then(() => {
        setPreferencesSaved(true);
        setError(null);
        preferences.forEach((pref, i) => {
          if (pref) fetchPreview(i, pref);
        });
      })
      .catch((err) => setError(`Could not save stations: ${err.message}`))
      .finally(() => setSavingPreferences(false));
  }, [preferences, fetchPreview]);

  // Keeps every currently-shown preview live, re-fetching on the same
  // 30-second cadence the backend's own real-time data refreshes on (see
  // Backend/src/app.py) - polling more often than that would just repeat
  // the same server-side data. Only refreshes slots that already have a
  // preview showing (i.e. have actually been saved), never a slot mid-edit
  // with no preview yet - same rule fetchPreview's callers already follow.
  useEffect(() => {
    const interval = setInterval(() => {
      preferences.forEach((pref, i) => {
        if (pref && previews[i]) fetchPreview(i, pref);
      });
    }, 30000);
    return () => clearInterval(interval);
  }, [preferences, previews, fetchPreview]);

  if (!authChecked) {
    return (
      <div className="card">
        <h1>TransitTicker</h1>
        <p className="sub boot-status">Checking sign-in status...</p>
      </div>
    );
  }

  if (!user) {
    return (
      <div className="card">
        <h1>TransitTicker</h1>
        <p className="sub">Sign in to set the stations your ticker tracks.</p>
        <div ref={googleButtonRef}></div>
        {error && <div className="error">{error}</div>}
      </div>
    );
  }

  return (
    <div className="card">
      <h1>TransitTicker</h1>
      <p className="sub">Embedded display simulator</p>

      <div className="auth-bar">
        <div className="signed-in">
          <span className="who">Signed in</span>
          <button className="sign-out" onClick={signOut}>Sign out</button>
        </div>
        <div className="device-status">
          {user.device_paired ? (
            <div className="paired">
              <span>Device paired</span>
              <button className="unlink-device" onClick={unlinkDevice} disabled={unlinkingDevice}>
                {unlinkingDevice ? "Unlinking..." : "Unlink device"}
              </button>
            </div>
          ) : (
            <div className="pair-form">
              <label htmlFor="pairing-code-input">Pair a device</label>
              <div className="pair-row">
                <input
                  id="pairing-code-input"
                  value={pairingCodeInput}
                  onChange={(e) => setPairingCodeInput(e.target.value.toUpperCase())}
                  placeholder="Code from device screen"
                  maxLength={6}
                />
                <button onClick={claimPairingCode} disabled={pairingDevice || !pairingCodeInput}>
                  {pairingDevice ? "Pairing..." : "Pair"}
                </button>
              </div>
            </div>
          )}
        </div>
      </div>

      <div className="my-stations">
        <h2>My Stations</h2>
        <p className="sub">
          Pick up to 3 stations and save them - each one previews live below
          once saved, the same data your paired device would show.
        </p>
        {[0, 1, 2].map((i) => (
          <div className="station-slot" key={i}>
            <StationPicker
              label={`Station ${i + 1}`}
              routes={routes}
              value={preferences[i]}
              onChange={(v) => updateSlot(i, v)}
            />
            {previews[i] && <DeparturesBoard departures={previews[i]} />}
          </div>
        ))}
        <button onClick={savePreferences} disabled={savingPreferences}>
          {savingPreferences ? "Saving..." : preferencesSaved ? "Saved" : "Save My Stations"}
        </button>
      </div>

      {error && <div className="error">{error}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
window.__transitTickerMounted = true; // tells the boot-status timeout script above not to report a false failure
</script>
</body>
</html>
