<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TransitTicker Simulator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1220;
    color: #e6edf3;
    padding: 24px 16px;
  }
  .card {
    background: #131b2b;
    border: 1px solid #223049;
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 2px; }
  p.sub { color: #8b96a8; margin: 0 0 22px; font-size: 0.85rem; }
  label { display: block; font-size: 0.8rem; color: #a7b2c4; margin: 16px 0 6px; }
  select, button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2a3852;
    background: #0e1626;
    color: #e6edf3;
    font-size: 0.95rem;
  }
  select:disabled { opacity: 0.5; }
  button {
    margin-top: 22px;
    background: #3b82f6;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #2a3852; cursor: not-allowed; }
  .result {
    margin-top: 20px;
    padding: 18px;
    border-radius: 8px;
    background: #0e1626;
    border: 1px solid #223049;
    text-align: center;
  }
  .result .big { font-size: 2.1rem; font-weight: 700; }
  .result .label { color: #8b96a8; font-size: 0.8rem; margin-top: 4px; }
  .error {
    color: #f87171;
    font-size: 0.82rem;
    margin-top: 14px;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Simple, no-build-step React setup: UMD builds + in-browser JSX transform.
     Fine for a small internal simulator UI; a real app would use a proper
     bundler, but that's unnecessary complexity here. -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Injected by the Flask server at runtime from the BACKEND_API_URL env var,
     so this image doesn't need to be rebuilt to point at a different backend. -->
<script src="/config.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

const BACKEND_URL = window.BACKEND_API_URL || "http://localhost:5000";

const DIRECTIONS = [
  { value: 0, label: "Uptown (0)" },
  { value: 1, label: "Downtown (1)" },
];

function App() {
  const [routes, setRoutes] = useState([]);
  const [stops, setStops] = useState([]);
  const [route, setRoute] = useState("");
  const [stop, setStop] = useState("");
  const [direction, setDirection] = useState(1);
  const [result, setResult] = useState(null);
  const [loadingRoutes, setLoadingRoutes] = useState(true);
  const [loadingStops, setLoadingStops] = useState(false);
  const [loadingResult, setLoadingResult] = useState(false);
  const [error, setError] = useState(null);

  // Load the route list once on mount.
  useEffect(() => {
    setLoadingRoutes(true);
    fetch(`${BACKEND_URL}/routes`)
      .then((res) => {
        if (!res.ok) throw new Error(`backend returned ${res.status}`);
        return res.json();
      })
      .then((data) => {
        setRoutes(data);
        setError(null);
      })
      .catch((err) => setError(`Could not load routes from ${BACKEND_URL}: ${err.message}`))
      .finally(() => setLoadingRoutes(false));
  }, []);

  // Re-load the stop list whenever the chosen route changes.
  useEffect(() => {
    setStop("");
    setResult(null);
    if (!route) {
      setStops([]);
      return;
    }
    setLoadingStops(true);
    fetch(`${BACKEND_URL}/routes/${encodeURIComponent(route)}/stops`)
      .then((res) => {
        if (!res.ok) throw new Error(`backend returned ${res.status}`);
        return res.json();
      })
      .then((data) => {
        setStops(data);
        setError(null);
      })
      .catch((err) => setError(`Could not load stops for route ${route}: ${err.message}`))
      .finally(() => setLoadingStops(false));
  }, [route]);

  const fetchNextArrival = useCallback(() => {
    if (!route || !stop) return;
    setLoadingResult(true);
    setResult(null);
    const params = new URLSearchParams({ route, stop, direction: String(direction) });
    fetch(`${BACKEND_URL}/?${params.toString()}`)
      .then((res) => {
        if (!res.ok) throw new Error(`backend returned ${res.status}`);
        return res.json();
      })
      .then((data) => {
        setResult(data);
        setError(null);
      })
      .catch((err) => setError(`Could not fetch next arrival: ${err.message}`))
      .finally(() => setLoadingResult(false));
  }, [route, stop, direction]);

  return (
    <div className="card">
      <h1>TransitTicker</h1>
      <p className="sub">Embedded display simulator</p>

      <label htmlFor="route-select">Route</label>
      <select
        id="route-select"
        value={route}
        onChange={(e) => setRoute(e.target.value)}
        disabled={loadingRoutes}
      >
        <option value="">{loadingRoutes ? "Loading routes..." : "Select a route"}</option>
        {routes.map((r) => (
          <option key={r} value={r}>{r}</option>
        ))}
      </select>

      <label htmlFor="stop-select">Stop</label>
      <select
        id="stop-select"
        value={stop}
        onChange={(e) => setStop(e.target.value)}
        disabled={!route || loadingStops}
      >
        <option value="">
          {!route ? "Select a route first" : loadingStops ? "Loading stops..." : "Select a stop"}
        </option>
        {stops.map((s) => (
          <option key={s.stop_id} value={s.stop_id}>{s.stop_name}</option>
        ))}
      </select>

      <label htmlFor="direction-select">Direction</label>
      <select
        id="direction-select"
        value={direction}
        onChange={(e) => setDirection(Number(e.target.value))}
      >
        {DIRECTIONS.map((d) => (
          <option key={d.value} value={d.value}>{d.label}</option>
        ))}
      </select>

      <button onClick={fetchNextArrival} disabled={!route || !stop || loadingResult}>
        {loadingResult ? "Checking..." : "Get Next Arrival"}
      </button>

      {error && <div className="error">{error}</div>}

      {result && (
        <div className="result">
          {result.next_departure_time ? (
            <>
              <div className="big">{result.minutes_away} min</div>
              <div className="label">Next departure at {result.next_departure_time}</div>
            </>
          ) : (
            <div className="label">No upcoming departures found for this selection.</div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
