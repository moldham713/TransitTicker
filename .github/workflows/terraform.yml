name: Terraform (AWS infrastructure)

on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_STATE_KEY: transitticker/terraform.tfstate
  TF_VERSION: "1.9.8"

jobs:
  # Runs on every PR/push/manual trigger - shows what would change, applies
  # nothing. This is where you review infrastructure changes before they
  # touch real, billable AWS resources.
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan -input=false

      - name: Plan summary
        run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"

      # Handed to the apply job below so it applies exactly what was reviewed
      # here, not a freshly re-planned diff that could have drifted in the
      # time it took to get approval.
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/tfplan
          retention-days: 5

  # Only for pushes to main and manual runs - never for pull requests, so
  # opening a PR can never apply anything by itself.
  apply:
    needs: plan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Configure this environment once in repo Settings > Environments, with
    # yourself added as a required reviewer. That makes this job pause for a
    # manual approval click before touching any real AWS resource, even
    # though the mechanics run entirely in GitHub Actions - the same "someone
    # watching it happen" safety property a local `terraform apply` had,
    # without needing a local `terraform apply`.
    environment: aws-infra
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: infra

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Show outputs
        run: terraform output
